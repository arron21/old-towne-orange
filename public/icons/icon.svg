<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="citrusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square / badge -->
  <rect width="512" height="512" rx="112" fill="url(#citrusGrad)"/>
  
  <!-- Outer decorative ring (The Circle) -->
  <circle cx="256" cy="240" r="185" fill="none" stroke="#fed7aa" stroke-width="6" stroke-dasharray="8 8" opacity="0.45"/>
  <circle cx="256" cy="240" r="170" fill="none" stroke="#fdfbf7" stroke-width="4" opacity="0.8"/>

  <!-- Orange fruit / Plaza Circle symbol -->
  <!-- Leaves at top -->
  <path d="M 256 120 C 235 85, 190 95, 180 115 C 205 130, 240 125, 256 120 Z" fill="#4d7c0f"/>
  <path d="M 256 120 C 275 80, 325 85, 335 110 C 310 128, 272 124, 256 120 Z" fill="#65a30d"/>
  <circle cx="256" cy="120" r="4" fill="#78350f"/>

  <!-- Historic Fountain Silhouette in Center -->
  <!-- Top jet water spray -->
  <path d="M 256 145 C 251 160, 246 175, 238 185 C 248 180, 256 170, 256 160 C 256 170, 264 180, 274 185 C 266 175, 261 160, 256 145 Z" fill="#bae6fd" filter="url(#shadow)"/>
  <circle cx="256" cy="142" r="6" fill="#e0f2fe"/>

  <!-- Fountain top finial -->
  <path d="M 253 180 L 259 180 L 257 195 L 255 195 Z" fill="#fef08a"/>

  <!-- Upper Tier Basin -->
  <ellipse cx="256" cy="202" rx="36" ry="10" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <ellipse cx="256" cy="200" rx="34" ry="7" fill="#fef9c3"/>

  <!-- Center Pedestal -->
  <path d="M 251 202 L 249 240 L 263 240 L 261 202 Z" fill="#ca8a04"/>

  <!-- Main Lower Basin -->
  <ellipse cx="256" cy="246" rx="85" ry="20" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <ellipse cx="256" cy="242" rx="80" ry="15" fill="#fef08a"/>
  <!-- Basin Water -->
  <ellipse cx="256" cy="242" rx="72" ry="11" fill="#38bdf8" opacity="0.8"/>

  <!-- Lower Base & Pedestal -->
  <path d="M 244 250 L 238 290 L 274 290 L 268 250 Z" fill="#a16207"/>
  <!-- Foundation steps -->
  <rect x="210" y="290" width="92" height="12" rx="3" fill="#ca8a04"/>
  <rect x="190" y="302" width="132" height="14" rx="4" fill="#a16207"/>

  <!-- Water drops ripples -->
  <circle cx="205" cy="256" r="3" fill="#e0f2fe" opacity="0.7"/>
  <circle cx="307" cy="256" r="3" fill="#e0f2fe" opacity="0.7"/>
  <circle cx="230" cy="220" r="2.5" fill="#e0f2fe" opacity="0.7"/>
  <circle cx="282" cy="220" r="2.5" fill="#e0f2fe" opacity="0.7"/>

  <!-- Historic Text Banner at Bottom -->
  <text x="256" y="365" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#fdfbf7" text-anchor="middle" letter-spacing="3">OLD TOWNE</text>
  <text x="256" y="405" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#fed7aa" text-anchor="middle" letter-spacing="8">ORANGE</text>
  <text x="256" y="432" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#ffedd5" text-anchor="middle" letter-spacing="4">EST. 1871 • HISTORIC DISTRICT</text>
</svg>
